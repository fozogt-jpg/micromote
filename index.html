<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Google TV Remote - micro:bit</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:Roboto,Arial,sans-serif;
}

body{
    background:#202124;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
}

.remote{
    width:100%;
    max-width:430px;
    padding:20px;
}


.connect{
    width:100%;
    height:54px;
    border:0;
    border-radius:28px;
    background:#8ab4f8;
    color:#202124;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}


.status{
    text-align:center;
    margin:18px 0;
    color:#9aa0a6;
}


.dpad{
    width:280px;
    height:280px;
    margin:auto;
    position:relative;
}


.outer{
    position:absolute;
    width:280px;
    height:280px;
    background:#303134;
    border-radius:50%;
}


.nav{
    position:absolute;
    width:70px;
    height:70px;
    border:0;
    background:none;
    color:#dadce0;
    font-size:38px;
    border-radius:50%;
    cursor:pointer;
}


.center{
    position:absolute;
    width:110px;
    height:110px;
    left:85px;
    top:85px;
    border:0;
    border-radius:50%;
    background:#5f6368;
}


.up{
    left:105px;
    top:15px;
}

.down{
    left:105px;
    bottom:15px;
}

.left{
    left:15px;
    top:105px;
}

.right{
    right:15px;
    top:105px;
}


.nav:active,
.center:active,
.small:active,
.vol button:active{
    transform:scale(.92);
    background:#5f6368;
}


.row{
    display:flex;
    justify-content:center;
    gap:35px;
    margin:35px 0;
}


.small{
    width:60px;
    height:60px;
    border:0;
    border-radius:50%;
    background:#303134;
    color:white;
    font-size:30px;
}


.vol{
    display:grid;
    grid-template-columns:1fr 1fr;
    overflow:hidden;
    border-radius:20px;
    background:#303134;
}


.vol button{
    height:65px;
    border:0;
    background:#303134;
    color:white;
    font-size:30px;
}


.footer{
    margin-top:20px;
    text-align:center;
    color:#80868b;
    font-size:13px;
}

</style>

</head>


<body>


<div class="remote">


<button class="connect" onclick="connectSerial()">
Connect micro:bit
</button>


<div class="status" id="status">
Disconnected
</div>



<div class="dpad">

<div class="outer"></div>


<button class="nav up" data-cmd="1">
▲
</button>


<button class="nav down" data-cmd="2">
▼
</button>


<button class="nav left" data-cmd="3">
◀
</button>


<button class="nav right" data-cmd="4">
▶
</button>


<button class="center" data-cmd="7">
</button>


</div>



<div class="row">


<button class="small" data-cmd="9">
‹
</button>


<button class="small" data-cmd="8">
⌂
</button>


</div>



<div class="vol">


<button data-cmd="6">
−
</button>


<button data-cmd="5">
+
</button>


</div>



<div class="footer">
micro:bit Web Serial Remote
</div>


</div>




<script>


let port;
let writer;
let reader;



async function connectSerial(){


if(!navigator.serial){

alert("Web Serial is not supported");

return;

}



try{


port = await navigator.serial.requestPort();



await port.open({

baudRate:115200

});



writer = port.writable.getWriter();



document.querySelector(".connect").style.display="none";


status.textContent="Connected";

status.style.color="#81c995";



watchDisconnect();



}catch(e){

console.log(e);

}


}





async function watchDisconnect(){


try{


reader = port.readable.getReader();



while(true){


const {done}=await reader.read();


if(done)
break;


}



}catch(e){}



disconnectSerial();


}





async function disconnectSerial(){


try{


if(writer)
writer.releaseLock();



if(reader)
reader.releaseLock();



if(port)
await port.close();



}catch(e){}



document.querySelector(".connect").style.display="block";


status.textContent="Disconnected";

status.style.color="#9aa0a6";


}






navigator.serial.addEventListener("disconnect",()=>{

disconnectSerial();

});







async function sendCommand(cmd){


if(!writer)
return;



await writer.write(

new TextEncoder().encode(cmd+"\n")

);



navigator.vibrate?.(20);


}





function attachButton(button){


let cmd=button.dataset.cmd;


if(!cmd)
return;



let timer;
let repeat;



function start(){


sendCommand(cmd);



timer=setTimeout(()=>{


repeat=setInterval(()=>{


sendCommand(cmd);


},100);



},350);



}





function stop(){


clearTimeout(timer);

clearInterval(repeat);


}




button.addEventListener("pointerdown",start);

button.addEventListener("pointerup",stop);

button.addEventListener("pointerleave",stop);

button.addEventListener("pointercancel",stop);



}





document

.querySelectorAll("[data-cmd]")

.forEach(attachButton);



</script>


</body>
</html>
